- name: Check for ECR image pull secret in target namespace
  become: yes
  become_user: jenkins
  environment:
    KUBECONFIG: /var/lib/jenkins/.kube/config
  shell: kubectl get secret ecr-registry -n {{ kube_namespace | default('dev') }}
  register: ecr_secret_check
  failed_when: false
  changed_when: false

- name: Create ECR image pull secret if missing
  become: yes
  become_user: jenkins
  environment:
    KUBECONFIG: /var/lib/jenkins/.kube/config
  shell: |
    kubectl create secret docker-registry ecr-registry \
          --docker-server={{ ecr_registry | default('254652353999.dkr.ecr.us-east-1.amazonaws.com') }} \
          --docker-username=AWS \
          --docker-password=$(aws ecr get-login-password --region {{ aws_region | default('us-east-1') }}) \
          --namespace {{ kube_namespace | default('dev') }}
  when: ecr_secret_check.rc != 0
