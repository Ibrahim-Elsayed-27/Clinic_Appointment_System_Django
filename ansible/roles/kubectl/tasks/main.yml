- name: Ensure ACL package is installed
  become: true
  ansible.builtin.dnf:
    name: acl
    state: present

- name: Get latest kubectl version
  uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: yes
  register: kubectl_stable

- name: Install kubectl
  get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_stable.content | trim }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Create .kube directory for jenkins user
  file:
    path: /var/lib/jenkins/.kube
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"

- name: Configure kubeconfig for Jenkins
  become: yes
  become_user: jenkins
  shell: aws eks update-kubeconfig --name {{ eks_cluster_name }} --region {{ aws_region }} --kubeconfig /var/lib/jenkins/.kube/config

- name: Set kubeconfig ownership
  file:
    path: /var/lib/jenkins/.kube/config
    owner: jenkins
    group: jenkins
    mode: "0600"

- name: Check for ECR image pull secret in target namespace
  become: yes
  become_user: jenkins
  shell: kubectl get secret ecr-registry -n {{ kube_namespace | default('dev') }}
  register: ecr_secret_check
  failed_when: false
  changed_when: false

- name: Create ECR image pull secret if missing
  become: yes
  become_user: jenkins
  shell: |
    aws ecr get-login-password --region {{ aws_region | default('us-east-1') }} \
      | kubectl create secret docker-registry ecr-registry \
        --docker-server={{ ecr_registry | default('254652353999.dkr.ecr.us-east-1.amazonaws.com') }} \
        --docker-username=AWS \
        --docker-password-stdin \
        --namespace {{ kube_namespace | default('dev') }}
  when: ecr_secret_check.rc != 0
