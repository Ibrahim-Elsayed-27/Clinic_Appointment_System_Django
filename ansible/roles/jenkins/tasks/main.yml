- name: Add Jenkins repo
  get_url:
    url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo

- name: Import Jenkins GPG key
  rpm_key:
    key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    state: present

- name: Install Jenkins
  dnf:
    name: jenkins
    state: present

- name: Start and enable Jenkins
  systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to start
  wait_for:
    port: 8080
    delay: 10
    timeout: 120

- name: Wait for Jenkins to fully initialize
  wait_for:
    path: /var/lib/jenkins/secrets/initialAdminPassword
    timeout: 120

- name: Get Jenkins initial admin password
  slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_password

- name: Print initial admin password
  debug:
    msg: "Jenkins initial password: {{ jenkins_password.content | b64decode | trim }}"

- name: Install Jenkins plugins
  jenkins_plugin:
    name: "{{ item }}"
    url: http://localhost:8080
    url_username: admin
    url_password: "{{ jenkins_password.content | b64decode | trim }}"
    state: present
  loop: "{{ lookup('ansible.builtin.file', 'files/plugins.txt').splitlines() }}"

- name: Create JCasC config directory
  file:
    path: /var/lib/jenkins/casc_configs
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"

- name: Set JCasC config path in Jenkins service
  lineinfile:
    path: /usr/lib/systemd/system/jenkins.service
    regexp: '^Environment="JAVA_OPTS='
    line: 'Environment="JAVA_OPTS=-Djava.awt.headless=true -Dcasc.jenkins.config=/var/lib/jenkins/casc_configs"'
  notify: daemon-reload and restart jenkins
