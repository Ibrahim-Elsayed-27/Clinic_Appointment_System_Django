apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clinic.fullname" . }}-media
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.media.accessMode }}
  storageClassName: efs-sc-{{ .Release.Namespace }}
  resources:
    requests:
      storage: {{ .Values.persistence.media.size }}