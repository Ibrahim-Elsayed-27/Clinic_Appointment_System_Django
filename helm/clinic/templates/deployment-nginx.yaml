apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clinic.nginxName" . }}
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "clinic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "clinic.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: static
              mountPath: /app/staticfiles
              readOnly: true
            - name: media
              mountPath: /app/media
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "clinic.nginxName" . }}-config
        - name: static
          persistentVolumeClaim:
            claimName: {{ include "clinic.fullname" . }}-static
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "clinic.fullname" . }}-media
