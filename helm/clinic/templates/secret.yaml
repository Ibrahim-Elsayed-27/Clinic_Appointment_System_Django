apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinic.fullname" . }}-secret
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.django.secretKey | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  
