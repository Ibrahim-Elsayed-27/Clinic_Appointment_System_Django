apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinic.fullname" . }}-config
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.database.host | default (include "clinic.dbName" .) | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  CSRF_TRUSTED_ORIGINS: {{ join "," .Values.django.csrfTrustedOrigins | quote }}
  ALLOWED_HOSTS: {{ join "," .Values.django.ALLOWED_HOSTS | quote }}

