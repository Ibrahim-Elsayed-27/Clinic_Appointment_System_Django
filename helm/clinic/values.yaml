replicaCount: 2

environment:
  development: false

image:
  repository: 254652353999.dkr.ecr.us-east-1.amazonaws.com/clinic-appointment
  tag: ""
  pullPolicy: IfNotPresent

nginx:
  image:
    repository: 254652353999.dkr.ecr.us-east-1.amazonaws.com/clinic-appointment
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

web:
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

database:
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  name: ""
  user: ""
  host: ""
  password: ""
  port: 5432
  storage:
    size: 5Gi
    storageClassName: ""

django:
  secretKey: ""
  ALLOWED_HOSTS:
    - "*"
  csrfTrustedOrigins:
    - http://localhost:8090

efs:
  fileSystemId: ""

persistence:
  media:
    accessMode: ReadWriteMany
    size: 2Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: clinic.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
