replicaCount: 2

environment:
  development: false

image:
  repository: clinic-web
  tag: latest
  pullPolicy: IfNotPresent

nginx:
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80

web:
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  resources: {}

database:
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  name: ""
  user: ""
  host: ""
  password: ""
  port: 5432
  storage:
    size: 5Gi
    storageClassName: ""

django:
  secretKey: ""
  ALLOWED_HOSTS:
    - "*"
  csrfTrustedOrigins:
    - http://localhost:8090

efs:
  fileSystemId: ""

persistence:
  media:
    accessMode: ReadWriteMany
    size: 2Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: clinic.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
